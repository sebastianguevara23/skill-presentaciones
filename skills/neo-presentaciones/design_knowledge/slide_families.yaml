version: neo_historical_v2

audit_contract:
  geometry_zone_pt: [30, 24, 690, 375]
  brand_zone_pt: [45, 31.4, 675, 375]
  output_canvas_px: [1920, 1080]
  output_safe_zone_px: [80, 64, 1840, 1000]
  required_checks: [geometry_audit, render_audit, visual_quality_audit, style_integrity_audit]
  visual_quality_failure_codes: [visually_cramped, visually_unbalanced, weak_hierarchy, inconsistent_rhythm, excessive_card_space]
  style_integrity_audit:
    failure_codes: [component_style_drift, shadow_drift, typography_drift, footer_scale_drift, off_palette_text, noncanonical_link_color]
    compare_scope: [same_family, repeated_component, paired_slide]
    compare_properties: [fill, line_color, line_width, radius, shadow, padding, typography, alignment, footer_size]
    allowed_variants: [content, card_count, documented_layout_variant, intentional_active_state]
    rule: repeated_components_must_match_canonically_unless_the_variant_is_registered
    visual_acceptance: render_and_compare_representative_slides_before_delivery
  agent_may_adjust: [box_size, spacing, grid, paragraph_width, component_distribution]
  content_lock: [no_new_text, no_summary, no_content_deletion, no_reordering, min_font_size_11]
  issue_record_fields: [slide_id, family, source_reference, symptom, measured_geometry, cause, applied_fix, acceptance_test, reusable_pattern]
  base_design_owner: agent_and_mcp

# Registro de navegación del deck de inducción. Los números son 1-based sobre su versión
# corregida; los frame_names son las claves de Figma.
families:
  title_slide:
    label: portada_light_obligatoria
    background: canonical_light
    source_reference: "Referencia v2, slide 1, revisión del usuario 2026-09-30"
    validate_after_layout: [cover_light_mode, text_contrast, safe_zone]
  table_of_contents:
    label: tabla_de_contenidos_indice
    output_slides: [3, 4, 19, 40, 61, 69, 72, 75]
    frame_names:
      - slide-03-agenda
      - slide-04-agenda-s1
      - slide-18-toc-s2
      - slide-38-toc-equipo
      - slide-59-toc-herramientas
      - slide-66-toc-tips
      - slide-69-toc-beneficios
      - slide-72-toc-fyi
    style:
      background: light
      title: "Tabla de contenidos"
      title_size_pt: 36
      title_y_pt: 77.4
      content_left_pt: 45
      logo_box_pt: [45, 31.4, 96.7, 19.3]
      footer_box_pt: [45, 360.4, 160, 14.6]
      card_state_style:
        active_fill: 000033
        active_text: FFFFFF
        inactive_fill: FFFFFF
        inactive_border: D9E2FC
        inactive_text: 000033
        number_pill_fill: 2D5BFF
      slide3_variant: all_cards_navy_reference
      card_state_style_applies_to_output_slides: [4, 19, 40, 61, 69, 72, 75]
    active_card_by_output_slide: {3: 1, 4: 1, 19: 2, 40: 3, 61: 4, 69: 5, 72: 6, 75: 7}

  # Caso concreto registrado desde la revisión manual de un deck interno de NEO.
  agenda_list:
    label: agenda_con_ilustracion_secundaria
    output_deck: "deck interno de NEO"
    output_slides: [5]
    source_reference: "captura del usuario, slide 5, 2026-09-23"
    preserve_content: true
    layout: lista_vertical_con_ilustracion_secundaria
    safe_zone_pt: [45, 31.4, 675, 375]
    card_box_pt: [45, 125.9, 415, 208.2]
    list_box_pt: [65, 142, 355, 176]
    list_style: {font: Montserrat, size_pt: 18, color: 000033, bullet_color: 2D5BFF, space_after_pt: 9}
    image_box_pt: [510, 183, 165, 92.7]
    image_rule: preserve_full_image_proportionally_and_keep_secondary_to_agenda_items
    acceptance: [four_ordered_agenda_items, image_within_registered_box, no_new_or_removed_text, source_image_and_link_integrity, geometry, render, visual_quality, text_palette]

  section_divider:
    label: separador_de_seccion
    output_slides: [14, 20, 34, 43, 45, 47, 53, 56]
    style:
      canonical_slide: 2
      format: canonical_slide_2
      preserve_content: true
      background: dark
      logo_default: left
      logo_box_pt: [45, 31.4, 96.7, 19.3]
      title_box_pt: [45, 170, 630, 48]
      footer_box_pt: [45, 360.4, 160, 14.6]
      # Separador NEO (D1, 2026-11-23). Un solo estilo: el de tokens.yaml → styles.dark.title.
      # Una línea, de 45 a 32 pt; si no entra, dos líneas (issue separator_title_two_lines).
      title_style: {font: Montserrat ExtraBold, size_pt: 45, min_pt: 32, max_lines: 1, color: FFFFFF,
                    emphasis_color: C5D5F7, italic: false}
      title_multiline_line_spacing: 0.8   # título en dos líneas o más (salto del autor o corte)
      title_emphasis_rule:
        first_word: base_color          # blanco
        rest: emphasis_color            # blue_pale, ExtraBold, sin itálica
        single_word: base_color
      # Línea azul bajo el título (tokens.yaml → components.separator_line): 125 × 4 pt, 14 pt
      # bajo el título y alineada a su x. El subtítulo va debajo de la línea.
      separator_line: {fill: 2D5BFF, width_pt: 125, height_pt: 4, gap_pt: 14}
      single_word_companion: null       # sin patrón geométrico (D1)
      single_word_companion_required: false
      single_word_copy_policy: no_invented_subtitle
      subtitle_style: {font: Montserrat Medium, size_pt: 11, color: C5D5F7}
      footer_style: {font: Montserrat, size_pt: 12, bold: true, color: C5D5F7}
      background_layers: [canonical_dark_background]
      background_asset: assets/brand/bg-dark-slide4.png

  image_text_clients:
    label: matriz_de_clientes_con_mensaje
    output_slides: [9]
    source_slide: "deck de inducción, slide 9"
    background: canonical_light
    preserve_content: true
    layout: source_image_left_message_right
