rules:
  navigation_title_uses_family_style: true
  text_palette_applies_to_preserved_and_hidden_slides: true
  hyperlinks_use_canonical_blue_without_exceptions: true
  use_available_safe_space: true
  safe_zone_is_mandatory_for_all_slides: true
  safe_zone_audit_required_before_delivery: true
  visual_integrity_required_before_delivery: true
  overlap_validation_required_before_delivery: true
  style_validation_required_inside_safe_zone: true
  orphan_words_forbidden: true
  orphan_word_audit_required_after_layout: true
  orphan_word_rule:
