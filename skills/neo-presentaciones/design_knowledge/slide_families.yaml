    logo_box_pt: [45, 31.4, 96.7, 19.3]
    footer_box_pt: [515, 360.4, 160, 14.6]
    footer_move_reason: source_image_occupies_left_lower_safe_area
    validate_after_layout: [source_image_present, text_presence, safe_zone, internal_overflow, visual_integrity, z_order]

  image_heavy_special:
